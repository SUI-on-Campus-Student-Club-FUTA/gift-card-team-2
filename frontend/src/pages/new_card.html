<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Card</title>
</head>
<body>
    <div class="max-w-7xl mx-auto flex-auto p-5">
        <header class="flex items-center justify-start gap-2">
            <h1 class="p-3 rounded-full bg-blue-300 font-bold"><-</h1>
            <p>New Card</p>
        </header>
        <form onsubmit="handleCreateCard">
            <label for="">
                <p>Name</p>
            </label>
            <select value="name">
                <option value="Apple Card">Apple Card</option>
                <option value="Visa Card">Visa Card</option>
                <option value="Sui Card">SUI Card</option>
                <option value="Maker Card">Maker Card</option>
                <option value="Master Card">Master Card</option>
            </select>
            <label for="price">
                <p>Price</p>
            </label>
            <input type="text" value="handleGetPrice(name)" disabled>
        </form>
    </div>
    <div>
        <!--success or error toast here-->
    </div>
</body>
</html>
