<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="relative bg-blue-300 home-page"> <div class="max-w-7xl mx-auto flex-auto p-5">
        <div class="flex items-center justify-start gap-2 mb-10">
            <img id="userImg" src="/images/placeholder.png" alt="User Avatar" class="w-16 h-16 rounded-full">
            <div>
                <p id="userName" class="font-bold">Loading Name...</p>
                <p id="userAddress" class="text-sm text-gray-700">Loading Address...</p>
            </div>
        </div>
        <div id="giftCardsDiv" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p>Loading gift cards...</p>
        </div>
        <button class="fixed bottom-10 right-10 p-4 bg-green-500 text-white rounded-full shadow-lg hover:bg-green-600 transition">
            <a href="new_card.html" class="text-white no-underline font-bold">New Card</a>
        </button>
    </div>
    
    <div id="transferPopup" class="absolute w-1/3 h-1/3 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-xl shadow-2xl transition-smooth duration-5" style="display: none;">
        <form onsubmit="window.handleTransferCard(event)">
            <p class="font-bold mb-4">Transfer GiftCard Ownership</p>
            <label for="recipientAddress">
                <p>Receiver's Address</p>
            </label>
            <input 
                id="recipientAddressInput"
                type="text"
                placeholder="Receiver's Address"
                class="w-full p-2 border rounded mb-4"
                required>
            <input type="hidden" id="cardToTransferId">
            <div class="flex justify-end gap-2">
                <button type="button" onclick="document.getElementById('transferPopup').style.display='none'" class="px-4 py-2 bg-gray-300 rounded">Cancel</button>
                <input type="submit" value="Send GiftCard" class="px-4 py-2 bg-blue-500 text-white rounded cursor-pointer">
            </div>
        </form>
    </div>
</body>
<script src="/frontend/src/main.ts"></script> 
<script type="module" src="/scripts/main.ts"></script>
</html>
