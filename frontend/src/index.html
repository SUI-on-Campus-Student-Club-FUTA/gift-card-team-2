<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftCard Website On Move</title>
    <link /><!--link tailwind cli and also poppins fonts-->
</head>
<body class="bg-blue-300">
    <div class="relative max-w-7xl mx-auto flex-auto p-5">
        <nav class="flex items-center justify-end">
            <button onclick="hanldleConnectWallet">
                <p>Connect Wallet</p>
            </button>
        </nav>

        <div 
            class="absolute top-1/2 left-1/2 -translate-x-1/2 
                -translate-y-1/2 text-center flex flex-col gap-3 shadow-md rounded-2xl">
            <h3 class="font-bold text-2xl">Welcome to SUI giftcards</h3>
            <p class="font-semibold text-xs">Send and create giftcards with ease</p>

            <form 
                onsubmit="handleCreateAccount()"
                class="flex flex-col gap-2">
                <label for="name">
                    <p>Name</p>
                </label>
                <input 
                    class="p-2 rounded-xl"
                    type="text"
                    value="name"
                    onchange="handleSetName(name)"
                    placeholder="Please Enter Your Preffered UserName">
                <input 
                    type="submit" 
                    value="Create Account"
                    disabled="!hasConnectedWallet">
            </form>
        </div>
    </div>
</body>
<script src="main.ts">
</script>
</html>
